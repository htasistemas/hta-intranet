services:
  postgres:
    image: postgres:16-alpine
    container_name: amtbrasil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amtbrasil
      POSTGRES_USER: amtbrasil
      POSTGRES_PASSWORD: amtbrasil
    ports:
      - "5432:5432"
    volumes:
      - amtbrasil_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amtbrasil -d amtbrasil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amtbrasil_postgres:
