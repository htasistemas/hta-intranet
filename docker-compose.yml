services:
  postgres:
    image: postgres:16-alpine
    container_name: torresoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torresoft
      POSTGRES_USER: torresoft
      POSTGRES_PASSWORD: torresoft
    ports:
      - "5432:5432"
    volumes:
      - torresoft_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torresoft -d torresoft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  torresoft_postgres:
