name: intranet-hta

services:
  postgres:
    image: postgres:16-alpine
    container_name: hta-intranet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hta_intranet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: hta-intranet-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3333
      FRONTEND_URL: https://intranet.torresoftbrasil.com.br
      EMAIL_TRACKING_BASE_URL: ${EMAIL_TRACKING_BASE_URL:-https://intranet.torresoftbrasil.com.br}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      APP_EMAIL_HABILITADO: ${APP_EMAIL_HABILITADO:-false}
      APP_EMAIL_REMETENTE: ${APP_EMAIL_REMETENTE:-}
      APP_EMAIL_NOME: ${APP_EMAIL_NOME:-Torresoft}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require(\x27http\x27).get(\x27http://localhost:3333/health\x27,res=>process.exit(res.statusCode===200?0:1)).on(\x27error\x27,()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: /api
    container_name: hta-intranet-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  hta_intranet_postgres:
