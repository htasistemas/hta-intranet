name: Deploy de producao

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar intranet.torresoftbrasil.com.br
    runs-on:
      - self-hosted
      - hta-intranet
    timeout-minutes: 20

    steps:
      - name: Atualizar checkout de producao
        working-directory: /home/srv/hta-intranet
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout master
          git merge --ff-only origin/master

      - name: Sincronizar configuracao SMTP protegida
        working-directory: /home/srv/hta-intranet
        env:
          APP_EMAIL_HABILITADO: ${{ secrets.APP_EMAIL_HABILITADO }}
          APP_EMAIL_REMETENTE: ${{ secrets.APP_EMAIL_REMETENTE }}
          APP_EMAIL_NOME: ${{ secrets.APP_EMAIL_NOME }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(".env.production")
          keys = (
              "APP_EMAIL_HABILITADO",
              "APP_EMAIL_REMETENTE",
              "APP_EMAIL_NOME",
              "MAIL_HOST",
              "MAIL_PORT",
              "MAIL_USER",
              "MAIL_PASS",
          )
          values = {key: os.environ[key] for key in keys}
          if any("\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("Configuracao SMTP invalida.")
          lines = path.read_text(encoding="utf-8").splitlines() if path.exists() else []
          output = []
          pending = set(keys)
          for line in lines:
              key = line.split("=", 1)[0].strip() if "=" in line else ""
              if key in values:
                  output.append(f"{key}={values[key]}")
                  pending.discard(key)
              else:
                  output.append(line)
          output.extend(f"{key}={values[key]}" for key in keys if key in pending)
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Validar configuracao
        working-directory: /home/srv/hta-intranet
        run: |
          set -euo pipefail
          test -s .env.production
          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Remover stack temporario com nome Torresoft
        working-directory: /home/srv/hta-intranet
        run: |
          set -euo pipefail
          docker compose \
            --project-name intranet-torresoft \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            down --remove-orphans || true

      - name: Construir e atualizar servicos
        working-directory: /home/srv/hta-intranet
        env:
          APP_EMAIL_HABILITADO: ${{ secrets.APP_EMAIL_HABILITADO }}
          APP_EMAIL_REMETENTE: ${{ secrets.APP_EMAIL_REMETENTE }}
          APP_EMAIL_NOME: ${{ secrets.APP_EMAIL_NOME }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            up -d --build --remove-orphans --wait --wait-timeout 180

      - name: Aplicar migrations
        working-directory: /home/srv/hta-intranet
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.production \
            -f docker-compose.prod.yml \
            exec -T backend npm exec -w backend prisma migrate deploy

      - name: Configurar proxy publico da intranet
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then
            echo "Nginx nao encontrado no host; pulando configuracao do proxy publico."
            exit 0
          fi
          if ! sudo -n true 2>/dev/null; then
            echo "Usuario do runner nao possui sudo sem senha; configure o vhost manualmente."
            exit 0
          fi
          sudo tee /etc/nginx/sites-available/intranet-torresoft >/dev/null <<'NGINX'
          server {
            listen 80;
            server_name intranet.torresoftbrasil.com.br;

            location / {
              proxy_pass http://127.0.0.1:8081;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
          NGINX
          sudo ln -sfn /etc/nginx/sites-available/intranet-torresoft /etc/nginx/sites-enabled/intranet-torresoft
          sudo nginx -t
          sudo systemctl reload nginx
          if command -v certbot >/dev/null 2>&1 && [ ! -d /etc/letsencrypt/live/intranet.torresoftbrasil.com.br ]; then
            sudo certbot --nginx \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              -d intranet.torresoftbrasil.com.br
          fi

      - name: Validar deploy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:8081/health
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --header "Host: intranet.torresoftbrasil.com.br" \
            http://127.0.0.1/health
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            https://intranet.torresoftbrasil.com.br/health
